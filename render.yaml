# Render Blueprint — MONJED backend (development branch)
# Dashboard: New > Blueprint > connect this repo, or create a Web Service manually with the same settings.

services:
  - type: web
    name: monjed-api-dev
    runtime: python
    branch: development
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: Monjed
      - key: GEMINI_API_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_SANDBOX_PHONES
        sync: false
      - key: CORS_ORIGINS
        sync: false
